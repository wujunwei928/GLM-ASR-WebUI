<!DOCTYPE html>
<html lang="zh-CN" data-theme="cyberpunk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syncopate:wght@400;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Nunito:wght@400;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==================== 基础样式 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* 隐藏粒子画布和扫描线（非默认主题） */
        #particleCanvas, .scanlines {
            transition: opacity 0.3s ease;
        }

        body:not([data-theme="cyberpunk"]) #particleCanvas,
        body:not([data-theme="cyberpunk"]) .scanlines {
            display: none;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-lg);
        }

        /* 标签内容区域 */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 音频预览 */
        .audio-preview audio {
            width: 100%;
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: var(--spacing-xl);
            display: none;
        }

        .loading.active {
            display: block;
        }

        /* 结果区域 */
        .result-area {
            padding: var(--spacing-lg);
            margin-top: var(--spacing-lg);
            display: none;
        }

        .result-area.active {
            display: block;
        }

        .result-text {
            padding: var(--spacing-md);
            min-height: 100px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* 错误消息 */
        .error {
            padding: var(--spacing-md);
            margin-top: var(--spacing-md);
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* 状态徽章 */
        .status-badge {
            display: inline-block;
            padding: var(--spacing-xs) var(--spacing-md);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: var(--spacing-sm);
        }

        /* ==================== 主题切换器 ==================== */
        .theme-switcher {
            position: fixed;
            top: var(--spacing-lg);
            right: var(--spacing-lg);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .theme-switcher-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.8;
        }

        .theme-select {
            padding: var(--spacing-xs) var(--spacing-md);
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.2));
            background: rgba(0, 0, 0, 0.3);
            color: inherit;
            font-family: inherit;
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .theme-select:hover {
            border-color: var(--neon-blue, #00f3ff);
        }

        .theme-select:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        /* ==================== 主题 1: 霓虹赛博朋克（默认） ==================== */
        [data-theme="cyberpunk"] {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff88;
            --neon-purple: #bf00ff;
            --dark-bg: #0a0e27;
            --darker-bg: #050814;
            --glass-bg: rgba(10, 14, 39, 0.7);
            --glass-border: rgba(0, 243, 255, 0.2);

            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;

            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;

            --transition-fast: 0.2s;
            --transition-normal: 0.3s;
            --transition-slow: 0.5s;

            font-family: 'Space Mono', monospace;
            background: var(--darker-bg);
            color: #ffffff;
        }

        [data-theme="cyberpunk"] #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
        }

        [data-theme="cyberpunk"] .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            display: block;
        }

        [data-theme="cyberpunk"] .container {
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        [data-theme="cyberpunk"] .header h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
            margin-bottom: var(--spacing-sm);
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.6));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(255, 0, 255, 0.8));
            }
        }

        [data-theme="cyberpunk"] .header-subtitle {
            font-size: 1rem;
            color: var(--neon-green);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        [data-theme="cyberpunk"] .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            box-shadow:
                0 8px 32px rgba(0, 243, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        [data-theme="cyberpunk"] .tabs {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
        }

        [data-theme="cyberpunk"] .tab {
            flex: 1;
            min-width: 200px;
            padding: var(--spacing-md);
            background: rgba(0, 243, 255, 0.05);
            border: 2px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--neon-blue);
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all var(--transition-normal);
            position: relative;
            overflow: hidden;
        }

        [data-theme="cyberpunk"] .tab.active {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(255, 0, 255, 0.2));
            border-color: var(--neon-blue);
            box-shadow:
                0 0 30px rgba(0, 243, 255, 0.5),
                inset 0 0 30px rgba(0, 243, 255, 0.1);
        }

        [data-theme="cyberpunk"] .upload-area {
            border: 3px dashed var(--glass-border);
            border-radius: var(--radius-md);
            padding: var(--spacing-xl);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-normal);
            background: rgba(0, 243, 255, 0.02);
        }

        [data-theme="cyberpunk"] .upload-area:hover {
            border-color: var(--neon-blue);
            background: rgba(0, 243, 255, 0.05);
        }

        [data-theme="cyberpunk"] .btn {
            padding: var(--spacing-md) var(--spacing-lg);
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: var(--radius-sm);
            color: #ffffff;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all var(--transition-normal);
        }

        [data-theme="cyberpunk"] .btn:hover {
            box-shadow:
                0 0 30px rgba(0, 243, 255, 0.6),
                0 0 60px rgba(191, 0, 255, 0.4);
            transform: translateY(-2px);
        }

        [data-theme="cyberpunk"] .btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            opacity: 0.5;
        }

        [data-theme="cyberpunk"] .btn-danger {
            background: linear-gradient(135deg, #ff0055, #ff0080);
        }

        /* 示例音频样式 */
        [data-theme="cyberpunk"] .example-audios {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-sm);
            margin-top: var(--spacing-sm);
        }

        [data-theme="cyberpunk"] .example-audio-item {
            padding: var(--spacing-md);
            background: rgba(0, 243, 255, 0.05);
            border: 2px solid var(--glass-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        [data-theme="cyberpunk"] .example-audio-item:hover {
            border-color: var(--neon-blue);
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            transform: translateY(-2px);
        }

        [data-theme="cyberpunk"] .audio-name {
            color: var(--neon-blue);
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* 输入组样式 */
        [data-theme="cyberpunk"] .input-group label {
            display: block;
            margin-bottom: var(--spacing-sm);
            color: var(--neon-green);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        [data-theme="cyberpunk"] .input-group input {
            width: 100%;
            padding: var(--spacing-md);
            background: rgba(0, 243, 255, 0.05);
            border: 2px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: #ffffff;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            transition: all var(--transition-normal);
        }

        [data-theme="cyberpunk"] .input-group input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow:
                0 0 20px rgba(0, 243, 255, 0.3),
                inset 0 0 20px rgba(0, 243, 255, 0.1);
        }

        [data-theme="cyberpunk"] .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* 文件信息样式 */
        [data-theme="cyberpunk"] .file-info {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid var(--neon-green);
            border-radius: var(--radius-sm);
            padding: var(--spacing-md);
            margin-top: var(--spacing-md);
            color: var(--neon-green);
            font-size: 0.9rem;
        }

        [data-theme="cyberpunk"] .record-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            border: 4px solid var(--neon-blue);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-normal);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        [data-theme="cyberpunk"] .record-btn.recording {
            background: linear-gradient(135deg, #ff0055, #ff0080);
            animation: recordingPulse 1.5s infinite;
        }

        @keyframes recordingPulse {
            0%, 100% {
                box-shadow:
                    0 0 20px rgba(255, 0, 85, 0.6),
                    0 0 40px rgba(255, 0, 128, 0.4);
            }
            50% {
                box-shadow:
                    0 0 40px rgba(255, 0, 85, 0.8),
                    0 0 80px rgba(255, 0, 128, 0.6);
            }
        }

        [data-theme="cyberpunk"] .timer {
            font-size: 3rem;
            font-weight: 700;
            color: var(--neon-green);
            margin: var(--spacing-lg) 0;
            text-shadow:
                0 0 20px rgba(0, 255, 136, 0.8),
                0 0 40px rgba(0, 255, 136, 0.4);
        }

        [data-theme="cyberpunk"] .result-area {
            background: rgba(0, 255, 136, 0.05);
            border: 2px solid var(--neon-green);
            border-radius: var(--radius-md);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        [data-theme="cyberpunk"] .result-area h3 {
            color: var(--neon-green);
            font-size: 1.3rem;
            margin-bottom: var(--spacing-md);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        [data-theme="cyberpunk"] .result-text {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: #ffffff;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        [data-theme="cyberpunk"] .error {
            background: rgba(255, 0, 85, 0.1);
            border: 2px solid #ff0055;
            border-radius: var(--radius-sm);
            color: #ff5580;
        }

        [data-theme="cyberpunk"] .status-badge.success {
            background: rgba(0, 255, 136, 0.2);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        [data-theme="cyberpunk"] .status-badge.error {
            background: rgba(255, 0, 85, 0.2);
            color: #ff5580;
            border: 1px solid #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }

        /* ==================== 主题 2: 极简主义白 ==================== */
        [data-theme="minimal"] {
            --white: #ffffff;
            --off-white: #f8f9fa;
            --gray-50: #f1f3f5;
            --gray-100: #e9ecef;
            --gray-200: #dee2e6;
            --gray-300: #ced4da;
            --gray-400: #adb5bd;
            --gray-500: #868e96;
            --gray-600: #495057;
            --gray-700: #343a40;
            --gray-800: #212529;
            --gray-900: #0d1117;
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --accent-red: #ff3b30;

            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 24px;

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.1);

            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--off-white);
            color: var(--gray-800);
            -webkit-font-smoothing: antialiased;
        }

        [data-theme="minimal"] .container {
            max-width: 900px;
            padding: 64px 24px;
            animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="minimal"] .header h1 {
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--gray-900);
            margin-bottom: var(--spacing-sm);
        }

        [data-theme="minimal"] .header-subtitle {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray-500);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        [data-theme="minimal"] .glass-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 32px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--gray-100);
        }

        [data-theme="minimal"] .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            background: var(--gray-50);
            padding: 4px;
            border-radius: 16px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        [data-theme="minimal"] .tab {
            padding: 8px 24px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--gray-600);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        [data-theme="minimal"] .tab:hover {
            color: var(--gray-800);
        }

        [data-theme="minimal"] .tab.active {
            background: var(--white);
            color: var(--gray-900);
            box-shadow: var(--shadow-sm);
        }

        [data-theme="minimal"] .upload-area {
            border: 2px dashed var(--gray-300);
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--gray-50);
        }

        [data-theme="minimal"] .upload-area:hover {
            border-color: var(--accent-blue);
            background: rgba(0, 122, 255, 0.02);
        }

        [data-theme="minimal"] .btn {
            padding: 16px 32px;
            background: var(--accent-blue);
            border: none;
            border-radius: 10px;
            color: var(--white);
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="minimal"] .btn:hover {
            background: #0066d6;
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        [data-theme="minimal"] .btn:disabled {
            background: var(--gray-300);
            cursor: not-allowed;
            box-shadow: none;
        }

        [data-theme="minimal"] .btn-danger {
            background: var(--accent-red);
        }

        [data-theme="minimal"] .record-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--gray-100);
            border: 8px solid var(--white);
            color: var(--gray-600);
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        [data-theme="minimal"] .record-btn.recording {
            background: var(--accent-red);
            color: var(--white);
        }

        [data-theme="minimal"] .timer {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--gray-900);
            margin: 24px 0;
            font-variant-numeric: tabular-nums;
        }

        [data-theme="minimal"] .result-area {
            background: var(--gray-50);
            border-radius: 16px;
            border: 1px solid var(--gray-200);
            animation: slideUp 0.4s ease-out;
        }

        [data-theme="minimal"] .result-area h3 {
            color: var(--gray-900);
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        [data-theme="minimal"] .result-text {
            background: var(--white);
            border-radius: 10px;
            color: var(--gray-800);
            font-size: 1rem;
            line-height: 1.7;
            border: 1px solid var(--gray-200);
        }

        [data-theme="minimal"] .error {
            background: rgba(255, 59, 48, 0.08);
            border: 1px solid rgba(255, 59, 48, 0.2);
            border-radius: 10px;
            color: var(--accent-red);
            font-size: 0.9375rem;
        }

        [data-theme="minimal"] .status-badge.success {
            background: rgba(52, 199, 89, 0.1);
            color: var(--accent-green);
        }

        [data-theme="minimal"] .status-badge.error {
            background: rgba(255, 59, 48, 0.1);
            color: var(--accent-red);
        }

        [data-theme="minimal"] .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--gray-700);
            font-size: 0.875rem;
            font-weight: 600;
        }

        [data-theme="minimal"] .input-group input {
            width: 100%;
            padding: 16px 24px;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            color: var(--gray-800);
            font-size: 0.9375rem;
            transition: all 0.15s;
        }

        [data-theme="minimal"] .input-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        [data-theme="minimal"] .example-audios {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 8px;
            margin-top: 8px;
        }

        [data-theme="minimal"] .example-audio-item {
            padding: 16px;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;

            top: -50%;

    <!-- 主题切换器 -->
    <div class="theme-switcher">

                            <span class="audio-name">example_zh.wav</span>

                        <div class="example-audio-item" data-url="/static/examples/example_en.wav">

                <div style="text-align: center; margin-top: 32px;">

                    <div style="display: flex; gap: 24px; justify-content: center; margin-top: 40px;">
                        <button class="btn" id="stopRecordingBtn" disabled>
                            <span>⏹ 停止</span>
                        </button>
                        <button class="btn btn-danger" id="cancelRecordingBtn" disabled>
                            <span>✖ 取消</span>
                        </button>
                    </div>

                    <div id="recordingPreview" class="audio-preview"></div>

                    <div style="margin-top: 40px;">
                        <button class="btn" id="sendRecordingBtn" disabled>
                            <span>🚀 发送录音识别</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 加载状态 -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p id="loadingMessage">⚡ 正在分析音频信号...</p>
                <div id="progressContainer"></div>
            </div>

            <!-- 识别结果 -->
            <div class="result-area" id="resultArea">
                <h3>🎯 识别结果</h3>
                <div class="result-text" id="resultText"></div>
                <div id="resultStatus"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 配置 ====================
        const CONFIG = {
            API_BASE_URL: '/api/v1',
            PARTICLE_COUNT: 80,
            PARTICLE_SPEED: 0.5,
            CONNECTION_DISTANCE: 150
        };

        // ==================== 全局变量 ====================
        let selectedFile = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordingTimer = null;
        let recordingSeconds = 0;
        let recordedBlob = null;

        // ==================== DOM 元素 ====================
        const elements = {
            themeSelect: document.getElementById('themeSelect'),
            tabs: document.querySelectorAll('.tab'),
            tabContents: document.querySelectorAll('.tab-content'),
            uploadArea: document.getElementById('uploadArea'),
            fileInput: document.getElementById('fileInput'),
            fileInfo: document.getElementById('fileInfo'),
            audioPreview: document.getElementById('audioPreview'),
            uploadBtn: document.getElementById('uploadBtn'),
            urlInput: document.getElementById('urlInput'),
            urlBtn: document.getElementById('urlBtn'),
            urlAudioPreview: document.getElementById('urlAudioPreview'),
            recordBtn: document.getElementById('recordBtn'),
            stopRecordingBtn: document.getElementById('stopRecordingBtn'),
            cancelRecordingBtn: document.getElementById('cancelRecordingBtn'),
            sendRecordingBtn: document.getElementById('sendRecordingBtn'),
            timer: document.getElementById('timer'),
            recordingPreview: document.getElementById('recordingPreview'),
            loading: document.getElementById('loading'),
            resultArea: document.getElementById('resultArea'),
            resultText: document.getElementById('resultText'),
            resultStatus: document.getElementById('resultStatus'),
            particleCanvas: document.getElementById('particleCanvas')
        };

        // ==================== 主题切换功能 ====================
        function initThemeSwitcher() {
            // 从 localStorage 读取保存的主题
            const savedTheme = localStorage.getItem('glm-asr-theme') || 'cyberpunk';
            setTheme(savedTheme);

            // 监听主题切换
            elements.themeSelect.addEventListener('change', (e) => {
                setTheme(e.target.value);
            });
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            elements.themeSelect.value = theme;
            localStorage.setItem('glm-asr-theme', theme);

            // 根据主题启动/停止粒子系统
            if (theme === 'cyberpunk') {
                if (!window.particleSystem) {
                    window.particleSystem = new ParticleSystem(elements.particleCanvas);
                }
            } else {
                if (window.particleSystem) {
                    window.particleSystem.stop();
                    window.particleSystem = null;
                }
            }
        }

        // ==================== 粒子背景系统 ====================
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.running = true;

                this.resize();
                window.addEventListener('resize', () => this.resize());

                this.initParticles();
                this.animate();
            }

            stop() {
                this.running = false;
                window.removeEventListener('resize', this.resize);
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            initParticles() {
                for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                    this.particles.push(this.createParticle());
                }
            }

            createParticle() {
                return {
                    x: Math.random() * this.canvas.width,
                    y: Math.random() * this.canvas.height,
                    vx: (Math.random() - 0.5) * CONFIG.PARTICLE_SPEED,
                    vy: (Math.random() - 0.5) * CONFIG.PARTICLE_SPEED,
                    radius: Math.random() * 2 + 1,
                    opacity: Math.random() * 0.5 + 0.2,
                    pulseSpeed: Math.random() * 0.02 + 0.01,
                    pulseOffset: Math.random() * Math.PI * 2
                };
            }

            updateParticle(particle) {
                particle.x += particle.vx;
                particle.y += particle.vy;

                if (particle.x < 0 || particle.x > this.canvas.width) {
                    particle.vx *= -1;
                }
                if (particle.y < 0 || particle.y > this.canvas.height) {
                    particle.vy *= -1;
                }

                particle.pulseOffset += particle.pulseSpeed;
            }

            drawParticle(particle) {
                const pulse = Math.sin(particle.pulseOffset) * 0.3 + 0.7;
                const gradient = this.ctx.createRadialGradient(
                    particle.x, particle.y, 0,
                    particle.x, particle.y, particle.radius * 2
                );
                gradient.addColorStop(0, `rgba(0, 243, 255, ${particle.opacity * pulse})`);
                gradient.addColorStop(1, 'rgba(0, 243, 255, 0)');

                this.ctx.beginPath();
                this.ctx.arc(particle.x, particle.y, particle.radius * 2, 0, Math.PI * 2);
                this.ctx.fillStyle = gradient;
                this.ctx.fill();
            }

            drawConnections() {
                for (let i = 0; i < this.particles.length; i++) {
                    for (let j = i + 1; j < this.particles.length; j++) {
                        const dx = this.particles[i].x - this.particles[j].x;
                        const dy = this.particles[i].y - this.particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < CONFIG.CONNECTION_DISTANCE) {
                            const opacity = (1 - distance / CONFIG.CONNECTION_DISTANCE) * 0.15;
                            this.ctx.beginPath();
                            this.ctx.strokeStyle = `rgba(0, 243, 255, ${opacity})`;
                            this.ctx.lineWidth = 1;
                            this.ctx.moveTo(this.particles[i].x, this.particles[i].y);
                            this.ctx.lineTo(this.particles[j].x, this.particles[j].y);
                            this.ctx.stroke();
                        }
                    }
                }
            }

            animate() {
                if (!this.running) return;

                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                this.particles.forEach(particle => {
                    this.updateParticle(particle);
                    this.drawParticle(particle);
                });

                this.drawConnections();

                requestAnimationFrame(() => this.animate());
            }
        }

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化主题切换器
            initThemeSwitcher();

            // 检查 API 健康状态
            checkAPIHealth();

            // 绑定事件监听器
            bindEventListeners();
        });

        // ==================== API 健康检查 ====================
        async function checkAPIHealth() {
            try {
                const response = await fetch(`${CONFIG.API_BASE_URL.replace('/api/v1', '')}/health`);
                const health = await response.json();

                if (health.status !== 'healthy') {
                    showError('⚠️ API 服务未就绪');
                }
            } catch (error) {
                // 忽略健康检查错误
            }
        }

        // ==================== 事件绑定 ====================
        function bindEventListeners() {
            // 标签切换
            elements.tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabName = tab.dataset.tab;

                    elements.tabs.forEach(t => t.classList.remove('active'));
                    elements.tabContents.forEach(c => c.classList.remove('active'));

                    tab.classList.add('active');
                    document.getElementById(tabName).classList.add('active');
                });
            });

            // 文件上传
            elements.uploadArea.addEventListener('click', () => elements.fileInput.click());

            elements.uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                elements.uploadArea.classList.add('dragover');
            });

            elements.uploadArea.addEventListener('dragleave', () => {
                elements.uploadArea.classList.remove('dragover');
            });

            elements.uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                elements.uploadArea.classList.remove('dragover');

                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFileSelect(files[0]);
                }
            });

            elements.fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFileSelect(e.target.files[0]);
                }
            });

            elements.uploadBtn.addEventListener('click', () => {
                if (!selectedFile) return;

                const formData = new FormData();
                formData.append('file', selectedFile);

                sendStreamRequest('/transcribe-stream', formData);
            });

            // 示例音频点击事件
            document.querySelectorAll('.example-audio-item').forEach(item => {
                item.addEventListener('click', () => {
                    const url = item.dataset.url;
                    // 如果是相对路径，拼接当前页面的完整域名
                    if (url.startsWith('/')) {
                        elements.urlInput.value = window.location.origin + url;
                    } else {
                        elements.urlInput.value = url;
                    }
                });
            });

            // URL 输入
            elements.urlBtn.addEventListener('click', async () => {
                const url = elements.urlInput.value.trim();
                if (!url) {
                    showError('请输入音频 URL');
                    return;
                }

                try {
                    showLoading(true, '正在从 URL 获取音频...');

                    const response = await fetch(url);
                    const blob = await response.blob();
                    const file = new File([blob], 'audio-from-url.wav', { type: blob.type });

                    const audioUrl = URL.createObjectURL(blob);
                    elements.urlAudioPreview.innerHTML = `
                        <div class="file-info">
                            <strong>已获取 URL 音频</strong><br>
                            <strong>大小:</strong> ${(blob.size / (1024 * 1024)).toFixed(2)} MB<br>
                            <strong>类型:</strong> ${blob.type || 'audio/*'}
                        </div>
                        <audio controls src="${audioUrl}" style="margin-top: 12px; width: 100%;"></audio>
                    `;

                    showLoading(false);

                    const formData = new FormData();
                    formData.append('file', file);
                    await sendStreamRequest('/transcribe-stream', formData);
                } catch (error) {
                    showError('无法从 URL 获取音频: ' + error.message);
                    showLoading(false);
                }
            });

            // 录音
            elements.recordBtn.addEventListener('click', startRecording);
            elements.stopRecordingBtn.addEventListener('click', stopRecording);
            elements.cancelRecordingBtn.addEventListener('click', cancelRecording);
            elements.sendRecordingBtn.addEventListener('click', sendRecording);
        }

        // ==================== 文件处理 ====================
        function handleFileSelect(file) {
            selectedFile = file;

            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            elements.fileInfo.innerHTML = `
                <div class="file-info">
                    <strong>已选择:</strong> ${file.name}<br>
                    <strong>大小:</strong> ${sizeMB} MB<br>
                    <strong>类型:</strong> ${file.type || 'audio/*'}
                </div>
            `;

            const url = URL.createObjectURL(file);
            elements.audioPreview.innerHTML = `
                <audio controls src="${url}"></audio>
            `;

            elements.uploadBtn.disabled = false;
        }

        // ==================== 录音功能 ====================
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    recordedBlob = new Blob(recordedChunks, { type: 'audio/webm' });

                    const url = URL.createObjectURL(recordedBlob);
                    elements.recordingPreview.innerHTML = `
                        <audio controls src="${url}"></audio>
                    `;

                    elements.sendRecordingBtn.disabled = false;
                };

                mediaRecorder.start();
                elements.recordBtn.classList.add('recording');
                elements.recordBtn.textContent = '🔴';
                elements.stopRecordingBtn.disabled = false;
                elements.cancelRecordingBtn.disabled = false;
                elements.recordBtn.disabled = true;

                recordingSeconds = 0;
                updateTimerDisplay();
                recordingTimer = setInterval(() => {
                    recordingSeconds++;
                    updateTimerDisplay();
                }, 1000);

            } catch (error) {
                showError('无法访问麦克风: ' + error.message);
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());

                clearInterval(recordingTimer);
                elements.recordBtn.classList.remove('recording');
                elements.recordBtn.textContent = '🎙️';
                elements.stopRecordingBtn.disabled = true;
                elements.cancelRecordingBtn.disabled = true;
                elements.recordBtn.disabled = false;
            }
        }

        function cancelRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }

            clearInterval(recordingTimer);
            elements.recordBtn.classList.remove('recording');
            elements.recordBtn.textContent = '🎙️';
            elements.stopRecordingBtn.disabled = true;
            elements.cancelRecordingBtn.disabled = true;
            elements.recordBtn.disabled = false;

            recordedChunks = [];
            recordedBlob = null;
            elements.recordingPreview.innerHTML = '';
            elements.sendRecordingBtn.disabled = true;
            recordingSeconds = 0;
            elements.timer.textContent = '00:00';
        }

        function sendRecording() {
            if (!recordedBlob) return;

            const file = new File([recordedBlob], 'recording.webm', { type: 'audio/webm' });
            const formData = new FormData();
            formData.append('file', file);

            sendStreamRequest('/transcribe-stream', formData);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(recordingSeconds / 60);
            const seconds = recordingSeconds % 60;
            elements.timer.textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // ==================== 流式 API 请求 ====================
        async function sendStreamRequest(endpoint, data) {
            hideError();
            showLoading(true, '正在处理音频...');

            const progressContainer = document.getElementById('progressContainer');
            if (progressContainer) {
                progressContainer.innerHTML = '';
            }

            const progressBar = createProgressBar();
            if (progressContainer) {
                progressContainer.appendChild(progressBar);
            }

            const resultChunks = [];

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}${endpoint}`, {
                    method: 'POST',
                    body: data
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (!line.trim()) continue;

                        try {
                            const data = JSON.parse(line);

                            switch (data.type) {
                                case 'info':
                                    updateLoadingMessage(data.message);
                                    break;

                                case 'chunk':
                                    resultChunks.push({
                                        index: data.chunk_index,
                                        text: data.text
                                    });

                                    updateProgressBar(progressBar, data.progress, data.chunk_index, data.total_chunks);
                                    appendStreamResult(data.text, data.chunk_index, data.total_chunks);
                                    break;

                                case 'error':
                                    showError(`分块 ${data.chunk_index + 1} 转录失败: ${data.error}`);
                                    break;

                                case 'complete':
                                    showFinalResult(resultChunks.map(r => r.text).join(' '));
                                    break;
                            }
                        } catch (parseError) {
                            console.error('解析响应失败:', line, parseError);
                        }
                    }
                }

            } catch (error) {
                showError('流式请求失败: ' + error.message);
            } finally {
                showLoading(false);
                if (progressBar && progressBar.parentNode) {
                    setTimeout(() => {
                        progressBar.remove();
                    }, 2000);
                }
            }
        }

        function createProgressBar() {
            const container = document.createElement('div');
            container.className = 'progress-container';
            container.innerHTML = `
                <div class="progress-info">
                    <span class="progress-status">准备中...</span>
                    <span class="progress-duration"></span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: 0%"></div>
                </div>
                <div class="progress-chunks"></div>
            `;
            return container;
        }

        function updateProgressBar(progressBar, progress, currentChunk, totalChunks) {
            const fill = progressBar.querySelector('.progress-bar-fill');
            const status = progressBar.querySelector('.progress-status');
            const chunks = progressBar.querySelector('.progress-chunks');

            fill.style.width = `${progress}%`;
            status.textContent = `正在处理: ${currentChunk + 1}/${totalChunks}`;
            chunks.textContent = `已完成 ${currentChunk + 1}/${totalChunks} 个分块`;
        }

        function appendStreamResult(text, chunkIndex, totalChunks) {
            elements.resultArea.classList.add('active');
            elements.resultText.innerHTML = '';

            const chunkMarker = document.createElement('div');
            chunkMarker.className = 'chunk-marker';
            chunkMarker.innerHTML = `
                <span class="chunk-number">📦 分块 ${chunkIndex + 1}/${totalChunks}</span>
                <span class="chunk-text">${text}</span>
            `;
            elements.resultText.appendChild(chunkMarker);

            elements.resultText.scrollTop = elements.resultText.scrollHeight;
        }

        function showFinalResult(fullText) {
            elements.resultText.innerHTML = fullText;
            elements.resultArea.classList.add('active');

            elements.resultStatus.innerHTML = `
                <span class="status-badge success">
                    ✅ 识别完成
                </span>
            `;
        }

        // ==================== UI 更新 ====================
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;

            const oldError = document.querySelector('.error');
            if (oldError) {
                oldError.remove();
            }

            document.querySelector('.glass-card').appendChild(errorDiv);

            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }

        function hideError() {
            const error = document.querySelector('.error');
            if (error) {
                error.remove();
            }
        }

        function showLoading(show, message = '⚡ 正在分析音频信号...') {
            const loadingMsg = document.getElementById('loadingMessage');
            if (loadingMsg) {
                loadingMsg.textContent = message;
            }

            if (show) {
                elements.loading.classList.add('active');
                elements.resultArea.classList.remove('active');
            } else {
                elements.loading.classList.remove('active');
            }
        }

        function updateLoadingMessage(message) {
            const loadingMsg = document.getElementById('loadingMessage');
            if (loadingMsg) {
                loadingMsg.textContent = message;
            }
        }
    </script>
</body>
</html>
